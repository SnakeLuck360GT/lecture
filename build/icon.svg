<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- LecScribe app icon (owner: filip). macOS grid: 824 px squircle centred in 1024, accent green,
       a tilted sticky note (margin notes) and the white pen from the in-app logo. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FAE93"/>
      <stop offset="1" stop-color="#26594B"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6C2"/>
      <stop offset="1" stop-color="#F7E58A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B2A22" flood-opacity=".35"/>
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="186" ry="186"/>
    </clipPath>
  </defs>

  <!-- tile -->
  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" ry="186" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="440" fill="url(#gloss)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="185" ry="185" fill="none" stroke="#FFFFFF" stroke-opacity=".12" stroke-width="3"/>

  <!-- sticky note, slightly tilted -->
  <g transform="rotate(-7 470 500)" filter="url(#shadow)">
    <path d="M300 300 h340 a24 24 0 0 1 24 24 v250 l-90 90 h-274 a24 24 0 0 1 -24 -24 v-316 a24 24 0 0 1 24 -24 z" fill="url(#note)"/>
    <path d="M664 574 l-90 90 v-66 a24 24 0 0 1 24 -24 z" fill="#E6CF63"/>
    <rect x="336" y="372" width="248" height="22" rx="11" fill="#2F6F5E" opacity=".55"/>
    <rect x="336" y="430" width="200" height="22" rx="11" fill="#2F6F5E" opacity=".38"/>
    <rect x="336" y="488" width="226" height="22" rx="11" fill="#2F6F5E" opacity=".38"/>
  </g>

  <!-- pen (same shape as the in-app mark: M11.5 2.5l2 2L6 12l-3 1 1-3 7.5-7.5z on a 16 grid) -->
  <g transform="translate(372 300) scale(31)" filter="url(#shadow)">
    <path d="M11.5 2.5l2 2L6 12l-3 1 1-3 7.5-7.5z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width=".55" stroke-linejoin="round"/>
    <path d="M10.2 3.8l2 2" stroke="#2F6F5E" stroke-width=".55" stroke-linecap="round" opacity=".55"/>
  </g>
</svg>
